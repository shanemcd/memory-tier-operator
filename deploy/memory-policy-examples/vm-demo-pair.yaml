# Demo pair: the same VM shape under the two modes.
#
# The workload-facing surface is ONE annotation. The class carries the
# mechanism; the user expresses need, not implementation.
---
# DRAM-only: renders requests==limits (Guaranteed; the Memory Manager
# then places the pod on the reservedMemory-declared DRAM node) plus
# the class backing (here: hugepages-2Mi).
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: demo-dram-only
spec:
  running: true
  template:
    metadata:
      annotations:
        memorytiering.shanemcd.com/policy-class: gold-hp
    spec:
      domain:
        devices: {}
        memory:
          guest: 1Gi
        disks:
          - name: rootdisk
            disk: {}
      volumes:
        - name: rootdisk
          containerDisk:
            image: quay.io/containerdisks/fedora:latest
---
# Tiered: renders NOTHING on the spec — the kernel's demotion is the
# mechanism — and records the decision on annotations for
# observability. (With the example classes, omitting the annotation
# entirely also resolves to the cluster default; the annotation here
# is explicit for the demo.)
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: demo-tiered
spec:
  running: true
  template:
    metadata:
      annotations:
        memorytiering.shanemcd.com/policy-class: tiered
        # The tier-aware descheduler may evict this VM from a node whose
        # DRAM comes under pressure (that is the stack working). Pin it to
        # the CXL node for the pressure side-by-side demo, and ask the
        # descheduler to leave it alone while the presser runs.
        descheduler.alpha.kubernetes.io/evict: "false"
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-cxl-0
      domain:
        devices: {}
        memory:
          # maxGuest pins the hotplug ceiling to the container budget:
          # kubevirt defaults maxGuest to guest*4 (memory hotplug), and
          # fedora auto-onlines virtio-mem, which would grow the guest
          # past the launcher's memory limit and OOM it.
          guest: 1Gi
          maxGuest: 1Gi
        disks:
          - name: rootdisk
            disk: {}
      volumes:
        - name: rootdisk
          containerDisk:
            image: quay.io/containerdisks/fedora:latest
