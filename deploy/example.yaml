# Example MemoryTiering custom resource.
# Creates the DeviceClasses and deploys the driver DaemonSet.
apiVersion: memorytier.shanemcd.com/v1alpha1
kind: MemoryTiering
metadata:
  name: cluster
spec:
  # Size the claimable DRAM pool per node. Workloads claiming dram-tier
  # draw from this budget; the remainder stays for unclaimed workloads.
  dramPoolSize: 2Gi
  # cxlPoolSize is omitted: the full online CXL memory is exposed.
  # nodeSelector is omitted: the driver publishes tiers only on nodes
  # where it finds CXL-attached memory, so it is safe to run everywhere.
