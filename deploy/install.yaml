apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: memorytierings.memorytier.shanemcd.com
spec:
  group: memorytier.shanemcd.com
  names:
    kind: MemoryTiering
    listKind: MemoryTieringList
    plural: memorytierings
    singular: memorytiering
    shortNames: [mt]
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              driverImage:
                type: string
                description: Overrides the driver daemon image. Defaults to the operator's own image.
              nodeSelector:
                type: object
                additionalProperties:
                  type: string
                description: Selects which nodes run the driver daemon.
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type: {type: string}
                    status: {type: string}
                    reason: {type: string}
                    message: {type: string}
                    lastTransitionTime: {type: string}
---
# Install: the operator Deployment, RBAC, CRDs (MemoryTiering,
# MemoryPolicy), webhook Service + MutatingWebhookConfiguration.
#
#   kubectl apply -f deploy/install.yaml
#   ./hack/webhook-certs.sh                 # TLS secret + caBundle patch
#   kubectl label ns <demo-ns> memorytiering.shanemcd.com/governed=true
#   kubectl apply -f deploy/memory-policy-examples/00-classes.yaml
#
# On OpenShift, first enable the internal registry and push the image:
#   ./hack/push-image.sh v8                  # builds + pushes the operator
# (the registry must be Managed with a defaultRoute — see
# hack/push-image.sh for the one-time cluster patch).
#
# Then create a MemoryTiering CR (deploy/example.yaml) for the driver,
# and VMIs in governed namespaces resolve a MemoryPolicy class at
# admission (deploy/memory-policy-examples/vm-demo-pair.yaml).
---
apiVersion: v1
kind: Namespace
metadata:
  name: kubevirt-mt
  labels:
    # The driver daemon is privileged (kubelet DRA plugin): hostPath
    # kubelet plugin dirs, hostPID, runAsUser=0. Restricted PodSecurity
    # would block the DaemonSet pods at admission.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# Registry namespace for the operator/driver image
# (image-registry.openshift-image-registry.svc:5000/kubevirt-dev/...).
# On OpenShift, cri-o authenticates internal-registry pulls as the
# POD's service account, so SAs in kubevirt-mt also need pull rights
# in kubevirt-dev (the registry path namespace) — granted below.
apiVersion: v1
kind: Namespace
metadata:
  name: kubevirt-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubevirt-mt-image-puller
  namespace: kubevirt-dev
  annotations:
    description: >-
      Lets pods from kubevirt-mt (operator, driver) pull the operator
      image, which lives in the kubevirt-dev registry namespace.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
- kind: Group
  name: system:serviceaccounts:kubevirt-mt
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: memory-tier-operator
  namespace: kubevirt-mt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: memory-tier-operator
rules:
- apiGroups: ["memorytier.shanemcd.com"]
  resources: ["memorytierings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["memorytier.shanemcd.com"]
  resources: ["memorypolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["kubevirt.io"]
  resources: ["virtualmachineinstances"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["memorytier.shanemcd.com"]
  resources: ["memorytierings/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["daemonsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["resource.k8s.io"]
  resources: ["deviceclasses"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceslices", "resourceclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "list", "watch", "create", "update"]
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings"]
  verbs: ["get", "list", "watch", "create", "update"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles", "clusterrolebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: memory-tier-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: memory-tier-operator
subjects:
- kind: ServiceAccount
  name: memory-tier-operator
  namespace: kubevirt-mt
---
# The operator creates SA memory-tier-driver for the driver DaemonSet
# at runtime; this binding takes effect as soon as that SA exists. The
# driver is a kubelet DRA plugin (hostPath plugin dirs, privileged) and
# needs the privileged SCC on OpenShift.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: memory-tier-driver-privileged-scc
  namespace: kubevirt-mt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
- kind: ServiceAccount
  name: memory-tier-driver
  namespace: kubevirt-mt
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-tier-operator
  namespace: kubevirt-mt
spec:
  replicas: 1
  selector:
    matchLabels: {app: memory-tier-operator}
  template:
    metadata:
      labels: {app: memory-tier-operator}
    spec:
      serviceAccountName: memory-tier-operator
      containers:
      - name: operator
        image: image-registry.openshift-image-registry.svc:5000/kubevirt-dev/memory-tier-operator:v8
        imagePullPolicy: Always
        args:
          - -operator-image=image-registry.openshift-image-registry.svc:5000/kubevirt-dev/memory-tier-operator:v8
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: webhook-certs
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
      volumes:
      - name: webhook-certs
        secret:
          secretName: memory-tier-operator-webhook
          optional: false
---
# Webhook service: exposes the operator's admission endpoint (9443)
# to the apiserver.
apiVersion: v1
kind: Service
metadata:
  name: memory-tier-operator
  namespace: kubevirt-mt
spec:
  selector: {app: memory-tier-operator}
  ports:
  - name: webhook
    port: 443
    targetPort: 9443
---
# Memory-policy admission governance (fail closed).
#
# Selects VMI CREATE in namespaces labeled
#   memorytiering.shanemcd.com/governed="true"
# only. Unlabeled namespaces are untouched: governance is opt-in per
# namespace, and the operator's own namespace (and system namespaces)
# never need the label.
#
# caBundle is deliberately ABSENT: hack/webhook-certs.sh patches it in
# after this manifest is applied, and an explicit empty value here would
# wipe that patch on every re-apply. (Apply order: install.yaml first,
# then webhook-certs.sh.)
# TLS secret and patches the bundle). With zero governed namespaces
# labeled, the missing bundle is inert.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: memory-policy-vmi-mutation
webhooks:
- name: vmi-mutation.memorytier.shanemcd.com
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: Fail
  matchPolicy: Equivalent
  rules:
  - apiGroups: ["kubevirt.io"]
    apiVersions: ["v1"]
    operations: ["CREATE"]
    resources: ["virtualmachineinstances"]
    scope: Namespaced
  clientConfig:
    service:
      name: memory-tier-operator
      namespace: kubevirt-mt
      port: 443
      path: /mutate-kubevirt-io-v1-virtualmachineinstance
  namespaceSelector:
    matchLabels:
      memorytiering.shanemcd.com/governed: "true"
---
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: memorypolicies.memorytier.shanemcd.com
  annotations:
    description: >-
      Administrator-defined memory policy classes for host-transparent
      memory tiering (memory-policy-classes prototype branch).
spec:
  group: memorytier.shanemcd.com
  scope: Cluster
  names:
    plural: memorypolicies
    singular: memorypolicy
    shortNames:
      - mempol
    kind: MemoryPolicy
    listKind: MemoryPolicyList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            MemoryPolicy is an administrator-defined memory policy
            class: the workload-facing QoS surface for host-transparent
            memory tiering. Workloads select a class by name; the class
            carries the mechanism and renders into existing Kubernetes
            and KubeVirt fields at admission.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - mode
              properties:
                mode:
                  type: string
                  enum:
                    - DRAMOnly
                    - Tiered
                  description: >-
                    DRAMOnly places guest memory on the fast tier at
                    admission and keeps it there (Memory Manager Static
                    placement + a persistence backing). Tiered is the
                    default system behavior: kernel demotion, no
                    mechanism rendered.
                backing:
                  type: object
                  description: >-
                    Persistence wall for DRAM-only classes
                    (Hugepages or MemLock); ignored for Tiered.
                  properties:
                    type:
                      type: string
                      enum:
                        - Hugepages
                        - MemLock
                      default: Hugepages
                    hugepageSize:
                      type: string
                      description: Hugepage size (default 2Mi); MemLock ignores this.
                  required:
                    - type
                default:
                  type: boolean
                  description: >-
                    Marks this class as the cluster default for
                    workloads that select nothing. At most one class
                    may set this.
                selection:
                  type: object
                  description: >-
                    AAA rules: which classes each namespace may use,
                    which are forbidden, which is forced. Most specific
                    namespace rule wins (exact over "*").
                  properties:
                    namespaceRules:
                      type: array
                      items:
                        type: object
                        required:
                          - namespace
                        properties:
                          namespace:
                            type: string
                            minLength: 1
                            description: Namespace, or "*" for all.
                          allowed:
                            type: array
                            items:
                              type: string
                            description: >-
                              Permitted classes; empty means all
                              (subject to forbidden).
                          forbidden:
                            type: array
                            items:
                              type: string
                          forced:
                            type: string
                            description: >-
                              Class used regardless of the workload's
                              selection.
                          default:
                            type: string
                            description: >-
                              Class for workloads selecting nothing;
                              overrides the cluster default.
            status:
              type: object
              description: Reserved; rendering outcome is recorded on the workload.

