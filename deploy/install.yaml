apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: memorytierings.memorytier.shanemcd.com
spec:
  group: memorytier.shanemcd.com
  names:
    kind: MemoryTiering
    listKind: MemoryTieringList
    plural: memorytierings
    singular: memorytiering
    shortNames: [mt]
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              driverImage:
                type: string
                description: Overrides the driver daemon image. Defaults to the operator's own image.
              nodeSelector:
                type: object
                additionalProperties:
                  type: string
                description: Selects which nodes run the driver daemon.
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type: {type: string}
                    status: {type: string}
                    reason: {type: string}
                    message: {type: string}
                    lastTransitionTime: {type: string}
---
# Install: the operator Deployment, RBAC, CRD, and namespace.
# After applying, create a MemoryTiering CR (see deploy/example.yaml)
# to start the driver on nodes with CXL-attached memory.
#
#   kubectl apply -f deploy/install.yaml
#   kubectl apply -f deploy/example.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: kubevirt-mt
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: memory-tier-operator
  namespace: kubevirt-mt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: memory-tier-operator
rules:
- apiGroups: ["memorytier.shanemcd.com"]
  resources: ["memorytierings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["memorytier.shanemcd.com"]
  resources: ["memorytierings/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["daemonsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["resource.k8s.io"]
  resources: ["deviceclasses"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceslices", "resourceclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "list", "watch", "create", "update"]
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings"]
  verbs: ["get", "list", "watch", "create", "update"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles", "clusterrolebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: memory-tier-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: memory-tier-operator
subjects:
- kind: ServiceAccount
  name: memory-tier-operator
  namespace: kubevirt-mt
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-tier-operator
  namespace: kubevirt-mt
spec:
  replicas: 1
  selector:
    matchLabels: {app: memory-tier-operator}
  template:
    metadata:
      labels: {app: memory-tier-operator}
    spec:
      serviceAccountName: memory-tier-operator
      containers:
      - name: operator
        image: image-registry.openshift-image-registry.svc:5000/kubevirt-dev/memory-tier-operator:v7
        imagePullPolicy: Always
        args: ["-operator-image=image-registry.openshift-image-registry.svc:5000/kubevirt-dev/memory-tier-operator:v7"]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
