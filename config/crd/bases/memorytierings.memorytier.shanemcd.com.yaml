apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: memorytierings.memorytier.shanemcd.com
spec:
  group: memorytier.shanemcd.com
  names:
    kind: MemoryTiering
    listKind: MemoryTieringList
    plural: memorytierings
    singular: memorytiering
    shortNames: [mt]
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              driverImage:
                type: string
                description: Overrides the driver daemon image. Defaults to the operator's own image.
              dramPoolSize:
                type: string
                description: Per-node DRAM capacity exposed for claims (e.g. "2Gi"). Default 2Gi.
              cxlPoolSize:
                type: string
                description: Overrides the per-node CXL capacity. Defaults to the full online CXL memory.
              nodeSelector:
                type: object
                additionalProperties:
                  type: string
                description: Selects which nodes run the driver daemon.
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type: {type: string}
                    status: {type: string}
                    reason: {type: string}
                    message: {type: string}
                    lastTransitionTime: {type: string}
